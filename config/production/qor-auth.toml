[server]
host = "0.0.0.0"
port = 8080
environment = "production"
# Browser origins allowed by CORS. Override with QOR_AUTH__SERVER__CORS_ALLOWED_ORIGINS (comma-separated).
cors_allowed_origins = ["https://demiurge.cloud"]

[database]
# Never commit credentials. Set QOR_AUTH__DATABASE__URL in the environment.
url = "${QOR_AUTH__DATABASE__URL}"
max_connections = 20

[redis]
url = "redis://localhost:6379"

[jwt]
# Secrets MUST come from the environment (QOR_AUTH__JWT__ACCESS_SECRET / QOR_AUTH__JWT__REFRESH_SECRET).
# Generate with: openssl rand -hex 32. Startup fails in RUN_ENV=production if these are empty,
# shorter than 32 bytes, or still a placeholder.
access_secret = "${QOR_AUTH__JWT__ACCESS_SECRET}"
refresh_secret = "${QOR_AUTH__JWT__REFRESH_SECRET}"
access_expiry_secs = 900
refresh_expiry_secs = 2592000
issuer = "qor-auth.demiurge.cloud"

[security]
max_login_attempts = 5
lockout_duration_secs = 900
max_sessions = 10
password_min_length = 12

[features]
# Starter CGT grant on registration. Disabled: balances_claimStarter is being removed.
# TODO(phase-1): starter grants must become a signed treasury transaction.
starter_grant_enabled = false

# Email configuration (uses environment variables)
# SMTP_HOST - SMTP server hostname (default: smtp.gmail.com)
# SMTP_PORT - SMTP port (default: 587)
# SMTP_USERNAME - SMTP username/email
# SMTP_PASSWORD - SMTP password or app password
# SMTP_FROM_EMAIL - Sender email address (default: noreply@demiurge.cloud)
# SMTP_FROM_NAME - Sender name (default: Demiurge Blockchain)
# BASE_URL - Base URL for verification links (default: https://demiurge.cloud)

# Admin bootstrap (never seed via migration):
# QOR_AUTH_BOOTSTRAP_GOD_PASSWORD - if set and no user with role 'god' exists at startup,
#   creates godmode#0001 with this password (Argon2id-hashed) and logs a warning. Unset afterwards.
