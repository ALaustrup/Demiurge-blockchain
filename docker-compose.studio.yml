# Demiurge Studio — local replacement for the retired OVH host.
# These containers are the Studio servers: Postgres + Valkey on localhost.
#
#   docker compose -f docker-compose.studio.yml up -d
#   npm run studio:start

name: demiurge-studio

services:
  pleroma-postgres:
    image: postgres:16-alpine
    container_name: pleroma-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: qor_auth
      POSTGRES_PASSWORD: demiurge_qor_auth_dev
      POSTGRES_DB: qor_auth
    volumes:
      - studio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qor_auth -d qor_auth"]
      interval: 5s
      timeout: 5s
      retries: 12

  pleroma-valkey:
    image: valkey/valkey:8-alpine
    container_name: pleroma-valkey
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["valkey-server", "--protected-mode", "no"]
    volumes:
      - studio_valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  studio_pg:
  studio_valkey:
